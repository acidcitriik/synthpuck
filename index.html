<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#080c18"/><style>html,body{background:#000;margin:0}#panel[data-screen="loading"]{position:fixed;inset:0;background:#000}</style><title>SYNTHPUCK — ABUNDANCE GAMES STUDIOS</title><link rel="stylesheet" href="./src/synthpuck.css?v=pause-overlay-20261106-1"/><link rel="stylesheet" href="./src/elevator-scene.css?v=yellow-native-button-lamps-20261106"/><link rel="stylesheet" href="./src/table-screen.css?v=table-screen-20261103-1"/><link rel="stylesheet" href="./src/player-account.css?v=credits-20261103-1"/><link rel="stylesheet" href="./src/online-menu.css?v=online-20261101-3"/></head>
<body><main id="app">
  <div id="scene"><canvas id="backdrop" aria-hidden="true"></canvas><canvas id="arena" aria-label="Arène de Synthpuck. Déplace la raquette avec la souris ou le doigt."></canvas><div id="fighterName" hidden></div></div>
  <div id="hud" hidden><div class="hud-left"><small id="hudMode">ARCADE</small><strong id="hudStage">SULACO · MUTE</strong></div><div id="score" aria-live="polite">0 <span>:</span> 0</div><div class="hud-right"><small id="hudLevel">01 / 07</small><strong id="hudStatus">PREMIER À 7</strong></div><button id="pauseButton" aria-label="Pause">Ⅱ</button></div>
  <div id="touchBar" hidden><button type="button" data-touch-mode="normal" class="chosen">NORMAL</button><button type="button" data-touch-mode="rigid">RIGIDE</button><button type="button" data-touch-mode="soft">AMORTI</button><button type="button" data-touch-mode="grip">SPIN</button></div>
  <section id="panel" aria-live="polite" data-screen="loading">
    <div class="asset-loading-footer" role="status" aria-live="polite">
      <img class="asset-loading-puck" src="./assets/sprites/puck.webp" alt="" aria-hidden="true" draggable="false">
      <span class="asset-loading-label">Chargement <output id="assetLoadingPercent">0%</output></span>
    </div>
  </section>
  <button id="creditsLauncher" type="button" aria-label="Afficher les crédits du jeu">CREDITS</button>
  <div id="versionCorner" aria-label="Version du jeu"><span id="versionLabel">ALPHA</span><button id="changelogLauncher" type="button" aria-label="Afficher les mises à jour">CHANGELOG</button></div>
  <button id="accountLauncher" type="button" aria-haspopup="dialog" aria-expanded="false">COMPTE / INVITÉ</button>
  <section id="accountOverlay" hidden aria-label="Gestion du compte joueur"></section>
</main><script type="module" src="./src/synthpuck.js?v=elevator-yellow-alignment-20261107"></script><script type="module" src="./src/player-account-ui.js?v=account-inputfix-20261101-1"></script></body></html>
